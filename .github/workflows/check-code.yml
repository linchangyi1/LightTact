name: Check LightTact code

on:
  push:
    paths: ['LightTact_code/**', 'tests/**', '.github/workflows/check-code.yml']
  pull_request:
    paths: ['LightTact_code/**', 'tests/**', '.github/workflows/check-code.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-checks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: LightTact_code/requirements.txt
      - run: python -m pip install -r LightTact_code/requirements.txt
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
